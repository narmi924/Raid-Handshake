name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: uv sync --python 3.11 --extra dev --frozen
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: npm ci
      - run: npm run build
